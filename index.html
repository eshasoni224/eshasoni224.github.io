<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esha Soni | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #2563eb;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .tag-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .tag {
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin-bottom: 28px;
        }
        h2 {
            font-size: 1.25rem;
            color: #334155;
            margin-bottom: 12px;
        }
        p {
            font-size: 1.05rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Esha Soni</h1>
        <div class="subtitle">Rutgers Business School</div>

        <div class="tag-container">
            <span class="tag">Junior</span>
            <span class="tag">Marketing Major</span>
            <span class="tag">Social Marketing</span>
            <span class="tag">Social Media Coordinator</span>
        </div>

        <hr>

        <h2>About Me</h2>
        <p>I’m Esha Soni, a junior at Rutgers Business School majoring in Marketing, passionate about social marketing and aspiring to support brands as a Social Media Coordinator.</p>
    </div>

</body>
</html>
